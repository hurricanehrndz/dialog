<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dialog</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ececec;
        --fg: #1d1d1f;
        --accent: #0a60ff;
        --btn-bg: #ffffff;
        --btn-border: #d0d0d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #2b2b2d;
          --fg: #f2f2f2;
          --btn-bg: #5a5a5e;
          --btn-border: #444;
        }
      }
      :root[data-appearance="dark"] {
        color-scheme: dark;
        --bg: #2b2b2d;
        --fg: #f2f2f2;
        --btn-bg: #5a5a5e;
        --btn-border: #444;
      }
      :root[data-appearance="light"] {
        color-scheme: light;
        --bg: #ececec;
        --fg: #1d1d1f;
        --btn-bg: #ffffff;
        --btn-border: #d0d0d0;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
        overflow: hidden;
      }
      body { font: 13px/1.45 system-ui, sans-serif; }
      body.platform-macos {
        font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
      }
      body.platform-windows {
        font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      }

      .dialog {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 16px 20px;
        gap: 8px;
      }
      .header { text-align: center; }
      .title {
        font-size: 26px;
        font-weight: 700;
        margin: 0;
      }
      .subtitle {
        font-size: 15px;
        font-weight: 400;
        opacity: 0.75;
        margin: 2px 0 0;
      }
      .main-row {
        flex: 1;
        display: flex;
        gap: 20px;
        min-height: 0;
        align-items: center;
      }
      .icon {
        flex: none;
        display: grid;
        place-items: center;
      }
      .icon-default { font-size: 96px; line-height: 1; }
      .message {
        flex: 1;
        align-self: stretch;
        overflow-y: auto;
        white-space: pre-wrap;
        font-size: 14px;
        padding-top: 6px;
      }
      .message.v-center { display: grid; align-content: center; }
      .message.v-bottom { display: grid; align-content: end; }
      .message > :first-child { margin-top: 0; }
      .message > :last-child { margin-bottom: 0; }
      .message p { margin: 0 0 0.6em; }
      .message a { color: var(--accent); }
      .message code {
        font-family: ui-monospace, "SF Mono", "Cascadia Code", monospace;
        font-size: 0.9em;
        background: color-mix(in srgb, var(--fg) 10%, transparent);
        padding: 1px 4px;
        border-radius: 3px;
      }
      .message img { max-width: 100%; }
      .message h1, .message h2, .message h3 { margin: 0.4em 0 0.3em; }
      .message ul, .message ol { margin: 0.3em 0; padding-left: 1.4em; }

      /* --mini: compact 540×128 single-row layout */
      .dialog.mini { padding: 10px 14px; gap: 4px; }
      .dialog.mini .title { font-size: 15px; font-weight: 600; }
      .dialog.mini .icon-default { font-size: 40px; }
      .dialog.mini .icon { width: 48px !important; }
      .dialog.mini .message { font-size: 12px; padding-top: 0; }
      .dialog.mini .buttons { padding-top: 4px; }
      .dialog.mini .btn { padding: 2px 12px; min-width: 60px; }

      .timer-bar {
        position: relative;
        flex: 1;
        height: 8px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--fg) 15%, transparent);
        align-self: center;
        margin: 0 6px;
      }
      .timer-fill {
        height: 100%;
        border-radius: 3px;
        background: var(--accent);
        transition: width 0.25s linear;
      }
      .timer-label {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 9px;
        opacity: 0.8;
      }

      .content-col {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        align-self: stretch;
        gap: 4px;
      }
      .content-col .message { flex: none; }
      .list {
        flex: 1;
        overflow-y: auto;
        border-radius: 8px;
        background: color-mix(in srgb, var(--fg) 4%, transparent);
        padding: 2px 10px;
      }
      .list-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 2px;
        border-bottom: 1px solid color-mix(in srgb, var(--fg) 8%, transparent);
      }
      .list.compact .list-row { padding: 3px 2px; }
      .list-row:last-child { border-bottom: none; }
      .list-text { flex: 1; min-width: 0; }
      .list-title { font-size: 13px; }
      .list-subtitle { font-size: 11px; opacity: 0.65; }
      .list-statustext { font-size: 12px; opacity: 0.75; }
      .list-status {
        min-width: 24px;
        text-align: center;
        font-weight: 700;
      }
      .status-success { color: #28a745; }
      .status-fail, .status-error { color: #dc3545; }
      .status-pending { opacity: 0.5; font-size: 10px; }
      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid color-mix(in srgb, var(--fg) 20%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin: 0 auto;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .row-progress {
        width: 60px;
        height: 5px;
        border-radius: 3px;
        background: color-mix(in srgb, var(--fg) 15%, transparent);
        overflow: hidden;
      }
      .row-progress-fill {
        height: 100%;
        background: var(--accent);
        transition: width 0.3s ease;
      }

      .progress { padding: 4px 0 2px; }
      .progress-bar {
        height: 8px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--fg) 15%, transparent);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        border-radius: 4px;
        background: var(--accent);
        transition: width 0.3s ease;
      }
      .progress-fill.indeterminate {
        width: 30%;
        animation: indet 1.4s ease-in-out infinite alternate;
      }
      @keyframes indet {
        from { margin-left: 0; }
        to { margin-left: 70%; }
      }
      .progress-text {
        text-align: center;
        font-size: 11px;
        opacity: 0.8;
        padding-top: 4px;
      }
      .infotext {
        font-size: 11px;
        opacity: 0.65;
        align-self: center;
      }

      .buttons {
        display: flex;
        gap: 10px;
        align-items: center;
        padding-top: 12px;
      }
      .spacer { flex: 1; }
      .btn {
        font: inherit;
        padding: 4px 18px;
        border-radius: 6px;
        border: 1px solid var(--btn-border);
        background: var(--btn-bg);
        color: var(--fg);
        min-width: 72px;
      }
      .btn:disabled { opacity: 0.45; }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        font-weight: 500;
      }
      body.platform-windows .btn { border-radius: 4px; }
      .btn.info { min-width: 0; }
    </style>
  </head>
  <body>
    <script src="main.js" defer></script>
  </body>
</html>
