[package]
name = "dialog-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tauri shell for the swiftDialog-compatible dialog utility"

[[bin]]
name = "dialog"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dialog-core = { path = "../dialog-core" }
# macos-private-api: transparent windows for --blurscreen's dim overlay.
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
ctrlc = { version = "3", features = ["termination"] }
# `--checksum <value>`: print SHA256(value) and exit, matching swiftDialog's
# hash-generation utility (paired with --authkey).
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Raise the --blurscreen overlay above the menu bar / dock (NSWindow level).
objc2 = "0.6"
