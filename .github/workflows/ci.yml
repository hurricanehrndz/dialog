name: CI

# Manual-only while iterating on a private repo (saves Actions minutes).
# Restore push/pull_request triggers when the repo opens up.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test-linux:
    name: Contract tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt --check

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - name: stdout reaches the invoking console (AttachConsole)
        # Verifies the cli-compatibility requirement "stdout reaches the
        # invoking console on Windows". Piped form: PowerShell launches
        # GUI-subsystem exes fire-and-forget unless a pipeline forces
        # wait-and-capture (verified on the rig, see cli-compatibility spec).
        shell: pwsh
        run: |
          cargo build --release -p dialog-app
          $out = & target/release/dialog.exe --version | Out-String
          if (-not $out.Trim()) { throw "no stdout captured from GUI-subsystem binary" }
          Write-Host "captured: $($out.Trim())"
